<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Tab — Spottr</title>
  <link rel="stylesheet" href="styles.css">
  <script src="theme-init.js"></script>
</head>
<body>
  <div id="theme-switcher">
    <button class="theme-btn" data-theme="neon-dusk" title="Neon Dusk" tabindex="-1">🌆</button>
    <button class="theme-btn" data-theme="light" title="Light" tabindex="-1">☀️</button>
    <button class="theme-btn" data-theme="midnight" title="Midnight" tabindex="-1">🌑</button>
  </div>
  <div id="spottr-overlay">
    <div id="spottr-dialog">
      <input id="spottr-input" type="text" placeholder="Search bookmarks, history, or enter a URL…" autofocus tabindex="1">
      <ul id="spottr-results"></ul>
    </div>
  </div>
  <div id="spottr-loading"><div class="loading-spinner"></div></div>
  <script src="spottr.js"></script>
</body>
</html>
